[project]
name = "scms-delivery"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pymysql>=1.2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scikit-posthocs>=0.16.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.63.0",
    "uvicorn[standard]>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["api/tests"]

